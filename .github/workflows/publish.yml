# Releases and npm publishing. Runs on every push to main:
#   1. release-please keeps a release PR open with the next version and CHANGELOG,
#      worked out from Conventional Commit messages.
#   2. Merging that PR makes release-please tag the commit and create the GitHub
#      release; the publish job then publishes that version to npm.
# Publishing lives in this workflow (not in one triggered by `release: published`)
# because releases created with GITHUB_TOKEN don't start other workflows. The file
# name must stay publish.yml: npm's trusted publisher is registered for it.
name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1+, staged publishing 11.15+.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm publish
