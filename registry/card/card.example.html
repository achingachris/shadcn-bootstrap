<!-- example: Login card -->
<div class="card" style="max-width: 24rem">
  <div class="card-header">
    <h3 class="card-title">Login to your account</h3>
    <p class="card-description">Enter your email below to login to your account</p>
    <div class="card-action"><a href="#" class="btn btn-link">Sign Up</a></div>
  </div>
  <div class="card-body">
    <form class="d-grid gap-4">
      <div class="d-grid gap-2">
        <label class="form-label mb-0" for="card-email">Email</label>
        <input class="form-control" id="card-email" type="email" placeholder="m@example.com" required>
      </div>
      <div class="d-grid gap-2">
        <div class="d-flex align-items-center">
          <label class="form-label mb-0" for="card-password">Password</label>
          <a href="#" class="ms-auto small">Forgot your password?</a>
        </div>
        <input class="form-control" id="card-password" type="password" required>
      </div>
    </form>
  </div>
  <div class="card-footer flex-column">
    <button type="submit" class="btn btn-solid theme-primary w-100">Login</button>
    <button type="button" class="btn btn-outline w-100">Login with Google</button>
  </div>
</div>
