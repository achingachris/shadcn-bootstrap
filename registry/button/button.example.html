<!-- example: Default -->
<button type="button" class="btn btn-solid theme-primary">Button</button>

<!-- example: Variants -->
<div class="d-flex flex-wrap gap-2 align-items-center">
  <button type="button" class="btn btn-solid theme-primary">Default</button>
  <button type="button" class="btn btn-solid theme-secondary">Secondary</button>
  <button type="button" class="btn btn-solid theme-danger">Destructive</button>
  <button type="button" class="btn btn-outline">Outline</button>
  <button type="button" class="btn btn-text">Ghost</button>
  <button type="button" class="btn btn-link">Link</button>
</div>

<!-- example: Sizes -->
<div class="d-flex flex-wrap gap-2 align-items-center">
  <button type="button" class="btn btn-outline btn-sm">Small</button>
  <button type="button" class="btn btn-outline">Default</button>
  <button type="button" class="btn btn-outline btn-lg">Large</button>
  <button type="button" class="btn btn-outline btn-icon" aria-label="Next">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<!-- example: With icon -->
<button type="button" class="btn btn-outline btn-sm">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg>
  New Branch
</button>

<!-- example: Loading -->
<button type="button" class="btn btn-outline btn-sm" disabled>
  <span class="spinner-border spinner-sm" role="status" aria-hidden="true"></span>
  Please wait
</button>

<!-- example: As a link -->
<a href="#" class="btn btn-solid theme-primary">Login</a>
