<!-- example: Default -->
<input class="form-control" type="email" placeholder="Email" aria-label="Email" style="max-width: 24rem">

<!-- example: With label -->
<div class="d-grid gap-2" style="max-width: 24rem">
  <label class="form-label mb-0" for="input-email">Email</label>
  <input class="form-control" type="email" id="input-email" placeholder="Email">
</div>

<!-- example: With button -->
<div class="d-flex gap-2" style="max-width: 24rem">
  <input class="form-control" type="email" placeholder="Email" aria-label="Email">
  <button type="submit" class="btn btn-outline">Subscribe</button>
</div>

<!-- example: File -->
<div class="d-grid gap-2" style="max-width: 24rem">
  <label class="form-label mb-0" for="input-picture">Picture</label>
  <input class="form-control" id="input-picture" type="file">
</div>

<!-- example: Disabled -->
<input class="form-control" type="email" placeholder="Email" aria-label="Email" disabled style="max-width: 24rem">

<!-- example: Invalid -->
<input class="form-control" type="email" value="not-an-email" aria-label="Email" aria-invalid="true" style="max-width: 24rem">
