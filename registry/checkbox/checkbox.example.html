<!-- example: Default -->
<div class="d-flex align-items-center gap-2">
  <input class="check" type="checkbox" id="check-terms">
  <label for="check-terms">Accept terms and conditions</label>
</div>

<!-- example: With description -->
<div class="form-field">
  <input class="check" type="checkbox" id="check-terms-2" checked>
  <div class="d-grid gap-2">
    <label for="check-terms-2">Accept terms and conditions</label>
    <p class="fg-3 small mb-0">By clicking this checkbox, you agree to the terms and conditions.</p>
  </div>
</div>

<!-- example: Disabled -->
<div class="d-flex align-items-center gap-2">
  <input class="check" type="checkbox" id="check-notify" disabled>
  <label for="check-notify">Enable notifications</label>
</div>

<!-- example: Card style -->
<label class="d-flex align-items-start gap-3 border rounded-3 p-3" style="max-width: 24rem" for="check-card">
  <input class="check" type="checkbox" id="check-card" checked>
  <span class="d-grid gap-1">
    <span class="fw-medium small">Enable notifications</span>
    <span class="fg-3 small">You can enable or disable notifications at any time.</span>
  </span>
</label>
