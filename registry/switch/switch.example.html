<!-- example: Default -->
<div class="d-flex align-items-center gap-2">
  <div class="switch"><input type="checkbox" role="switch" id="switch-airplane"></div>
  <label for="switch-airplane">Airplane Mode</label>
</div>

<!-- example: Checked and disabled -->
<div class="d-grid gap-3">
  <div class="d-flex align-items-center gap-2">
    <div class="switch"><input type="checkbox" role="switch" id="switch-on" checked></div>
    <label for="switch-on">Marketing emails</label>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="switch"><input type="checkbox" role="switch" id="switch-off" disabled></div>
    <label for="switch-off">Security emails (disabled)</label>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="switch"><input type="checkbox" role="switch" id="switch-on-disabled" checked disabled></div>
    <label for="switch-on-disabled">Required (checked, disabled)</label>
  </div>
</div>

<!-- example: Sizes -->
<div class="d-flex align-items-center gap-4">
  <div class="switch switch-sm"><input type="checkbox" role="switch" aria-label="Small switch" checked></div>
  <div class="switch"><input type="checkbox" role="switch" aria-label="Default switch" checked></div>
  <div class="switch switch-lg"><input type="checkbox" role="switch" aria-label="Large switch" checked></div>
</div>
